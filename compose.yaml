services:
  app:
    build: .
    image: babblr-backend
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/${DB_NAME:-babblr}
      DB_NAME: ${DB_NAME:-babblr}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  mongo-data:
